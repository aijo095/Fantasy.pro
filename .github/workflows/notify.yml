name: notify
# محرك الإشعارات الذكي: وظيفة وحدة تشتغل ~55 دقيقة
# • وقت المباريات الشغالة: فحص كل 15 ثانية (الفحص خفيف لأن بيانات اللعبة محفوظة 10 دقايق)
# • قبل المباريات بساعتين ونص وقبل الإغلاق بساعتين: فحص كل 30 ثانية
# • باقي الأوقات (ما كو مباريات): فحص كل 5 دقايق لتوفير المعالج
# الوضع يحدده /api/notify نفسه بالحقل mode، وإذا ما رجع شي نعتبره «مباشر» احتياطاً
# (الجدول كل 10 دقايق احتياط إذا GitHub أخّر أو أسقط تشغيل؛ concurrency يمنع التكرار)
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
concurrency:
  group: notify-loop
  cancel-in-progress: false
jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Smart notifier loop
        run: |
          end=$(( $(date +%s) + 55*60 ))
          while [ $(date +%s) -lt $end ]; do
            out=$(curl -sS --max-time 50 https://fantasy-pro-aijo0.vercel.app/api/notify || true)
            echo "$out" | head -c 300; echo
            if echo "$out" | grep -q '"mode":"idle"'; then sleep 300; elif echo "$out" | grep -q '"mode":"match"'; then sleep 15; else sleep 30; fi
          done
